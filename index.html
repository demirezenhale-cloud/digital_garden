<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Hale Demirezen" />
    <meta name="color-scheme" content="dark light" />

    <title>Digital garden van Hale</title>
    <link rel="stylesheet" href="./css/normal.css" />

    <!-- Voeg jouw eigen domein toe in data-page -->
    <script
      data-page="https://haledigitalgarden.nl/"
      src="./scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <!-- HEADER: De titel en navigatie van de website.
       (Web sitesinin başlığı ve navigasyonu.) -->
    <header>
      <!-- Thema-keuze: licht of donker. Methode uit de les (Vasilis).
     (Tema seçimi: açık ya da koyu. Dersteki yöntem.) -->
      <fieldset>
        <legend>Theme</legend>

        <!-- Zon = licht thema. (Güneş = açık tema.) -->
        <label>
          <input
            type="radio"
            name="theme"
            value="light"
            aria-label="Light theme"
          />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </label>

        <!-- Maan = donker thema. (Ay = koyu tema.) -->
        <label>
          <input
            type="radio"
            name="theme"
            value="dark"
            aria-label="Dark theme"
          />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </label>
      </fieldset>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li>
            <a href="https://github.com/demirezenhale-cloud/digital_garden"
              >Learning Log</a
            >
          </li>
        </ul>
      </nav>

      <h1>Little Steps, Bright Paths</h1>
      <p>Explore 8 Paths to Better Habits</p>

      <a href="#stop-1">Start!</a> 
    </header>

    <!-- MAIN: De belangrijkste inhoud van de website.
       (Web sitesinin ana içeriği.) -->
    <main>
      <!-- SECTION: De interactieve kaart.
         (Etkileşimli harita.) -->
      <section>
        <h2>Explore the Habit Map</h2>

        <!-- STOPS: Acht onderwerpen uit Atomic Habits.
             (Atomic Habits kitabından sekiz konu.) -->

        <!-- Stop 1: Kleine stappen, grote veranderingen.
             (Küçük adımlar, büyük değişimler.) -->
        <article id="stop1">
          <h3>Small Steps, Big Changes</h3>
        </article>

        <!-- Stop 2: Systemen in plaats van doelen.
             (Hedefler yerine sistemler.) -->
        <article>
          <h3>Systems Over Goals</h3>
        </article>

        <!-- Stop 3: Gewoontes en identiteit.
             (Alışkanlıklar ve kimlik.) -->
        <article>
          <h3>Habits and Identity</h3>
        </article>

        <!-- Stop 4: De twee-minutenregel.
             (İki dakika kuralı.) -->
        <article>
          <h3>The Two-Minute Rule</h3>
        </article>

        <!-- Stop 5: De invloed van je omgeving.
             (Çevrenin davranışlara etkisi.) -->
        <article>
          <h3>The Power of Environment</h3>
        </article>

        <!-- Stop 6: Gewoontes stapelen.
             (Alışkanlıkları birbirine bağlamak.) -->
        <article>
          <h3>Habit Stacking</h3>
        </article>

        <!-- Stop 7: Je voortgang zichtbaar maken.
             (İlerlemeyi görünür kılmak.) -->
        <article>
          <h3>Track Your Progress</h3>
        </article>

        <!-- Stop 8: Slechte gewoontes veranderen.
             (Kötü alışkanlıkları değiştirmek.) -->
        <article>
          <h3>Breaking Bad Habits</h3>
        </article>
      </section>
    </main>

    <!-- FOOTER: Het onderste deel van de website.
       (Web sitesinin alt bölümü.) -->
    <footer></footer>
  </body>
</html>
